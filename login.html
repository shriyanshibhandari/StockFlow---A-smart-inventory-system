<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body{
            margin:8px;
            background:url('https://i.pinimg.com/736x/d5/d6/ee/d5d6ee25a387c59190016f514dc8d08d.jpg') no-repeat center/cover;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        fieldset{
            background:rgba(0,0,0,0.4);
            padding:30px;
            border-radius:10px;
            color:white;
        }

        input{
            width:250px;
            padding:8px;
            border:none;
            border-radius:5px;
        }

        button{
            width:100%;
            padding:10px;
            border:none;
            border-radius:5px;
            background:#333;
            color:white;
            cursor:pointer;
        }

        button:hover{
            background:#555;
        }

        a{
            color:#ddd;
        }
    </style>
</head>

<body>

<fieldset>

<form id="loginForm">

    <h2 align="center">LOGIN PAGE</h2>

    <label>Email</label><br>
    <input type="email" id="email" placeholder="Enter your Email"><br><br>

    <label>Password</label><br>
    <input type="password" id="password" placeholder="Enter your password"><br><br>

    <a href="forgot.html">Forgot Password?</a><br><br>

    <button type="submit">Login</button>

    <p>Not registered? <a href="signup.html">Register</a></p>

</form>

</fieldset>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const formData = new URLSearchParams();
    formData.append("username", email);
    formData.append("password", password);

    const response = await fetch("http://127.0.0.1:8000/api/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: formData
    });

    const result = await response.json();

    if(response.ok){
        localStorage.setItem("token", result.access_token);
        alert("Login Successful ✅");

        // 👉 CONNECT TO SEARCH PAGE
        window.location.href = "search.html";
    }
    else{
        alert(result.detail);
    }
});
</script>

</body>
</html>
